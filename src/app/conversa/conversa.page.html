<ion-content class="chat-bg">
  
  <div class="chat-header">
    <div class="top-row">
      <ion-icon name="arrow-back-outline" class="back-btn" (click)="voltar()"></ion-icon>
      <h1 class="page-title">Mensagens</h1>
      <ion-icon name="chatbubble" class="chat-icon"></ion-icon>
    </div>
    
    <div class="contact-info">
      <img [src]="avatarContato" class="contact-avatar" />
      <h2 class="contact-name">{{ nomeContato }}</h2>
    </div>
  </div>

  <div class="chat-body">
    <div *ngFor="let msg of mensagens" 
         class="message-wrapper" 
         [ngClass]="{'msg-eu': msg.remetente === 'eu', 'msg-outro': msg.remetente === 'outro'}">
      
      <div class="message-bubble">
        <p>{{ msg.texto }}</p>
        <span class="message-time">{{ msg.hora }}</span>
      </div>

    </div>
  </div>

</ion-content>

<ion-footer class="ion-no-border">
  <div class="chat-footer">
    
    <div class="input-container">
      <input type="text" placeholder="Escreve aqui..." [(ngModel)]="novaMensagem" (keyup.enter)="enviarMensagem()" />
    </div>
    
    <ion-icon name="send" class="send-btn" (click)="enviarMensagem()"></ion-icon>
    
    <input type="file" accept="image/*" (change)="enviarFoto($event)" #fileInput style="display: none;" />
    <ion-icon name="camera" class="camera-btn" (click)="fileInput.click()"></ion-icon>
    
  </div>
</ion-footer>
