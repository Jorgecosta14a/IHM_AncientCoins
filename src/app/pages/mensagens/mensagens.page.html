<ion-content class="mensagens-bg">
  
  <div class="header-section">
    <ion-icon name="arrow-back-outline" class="back-btn" routerLink="/explorar"></ion-icon>
    
    <div class="title-row">
      <h1 class="page-title">Mensagens</h1>
      <ion-icon name="chatbox" class="chat-icon"></ion-icon>
    </div>
    
    <div class="search-bar">
      <input type="text" placeholder="Pesquisar conversas" />
    </div>
  </div>

  <div class="messages-container">
    
    <div class="message-card" *ngFor="let conversa of conversas" routerLink="/conversa">
      
      <div class="avatar-slot">
        <img [src]="conversa.avatar" alt="Avatar" class="avatar" />
      </div>
      
      <div class="message-info">
        <h3 class="user-name">{{ conversa.nome }}</h3>
      </div>
      
      <div class="unread-badge-slot" *ngIf="conversa.naoLidas > 0">
        <div class="unread-badge">{{ conversa.naoLidas }}</div>
      </div>
      
    </div>

  </div>
</ion-content>
