<ion-content class="ativos-bg">
  <div class="top-nav">
    <ion-icon name="arrow-back-outline" class="back-btn" (click)="voltar()"></ion-icon>
    <h1 class="page-title">Anúncios ativos</h1>
  </div>

  <div class="ads-container">
    
    <!-- Caso não haja anúncios -->
    <div class="empty-state" *ngIf="anuncios.length === 0">
      <p>Ainda não tens anúncios ativos.</p>
    </div>

    <!-- Lista de Anúncios -->
    <div class="ad-card" *ngFor="let anuncio of anuncios">
      
      <div class="ad-content">
        <img [src]="anuncio.imagem" alt="Moeda" class="ad-img" />
        <div class="ad-details">
          <h2 class="ad-name">{{ anuncio.nome }}</h2>
          <p class="ad-price">{{ anuncio.preco }}€</p>
          
          <div class="ad-stats">
            <span class="stat"><ion-icon name="eye-outline"></ion-icon> {{ anuncio.visualizacoes }}</span>
            <span class="stat"><ion-icon name="chatbubble-outline"></ion-icon> {{ anuncio.mensagens }}</span>
          </div>
        </div>
      </div>
      
      <div class="ad-actions">
        <span class="action-edit">Editar</span>
        <span class="action-remove" (click)="remover(anuncio.id)">Remover</span>
      </div>

    </div>
  </div>
</ion-content>
