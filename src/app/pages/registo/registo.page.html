<ion-content class="auth-bg">
  <div class="overlay">
    
    <h1 class="main-title">Junte-se a nós</h1>

    <div class="auth-card">
      <h2 class="card-title">Criar conta</h2>

      <div class="input-group">
        <label>Nome de Utilizador</label>
        <ion-item lines="none" class="custom-input">
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-input type="text"></ion-input>
        </ion-item>
      </div>

      <div class="input-group">
        <label>E-mail</label>
        <ion-item lines="none" class="custom-input">
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-input type="email"></ion-input>
        </ion-item>
      </div>

      <div class="input-group">
        <label>Palavra-passe</label>
        <ion-item lines="none" class="custom-input">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input type="password"></ion-input>
        </ion-item>
      </div>

      <div class="input-group">
        <label>Confirmar palavra-passe</label>
        <ion-item lines="none" class="custom-input">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input type="password"></ion-input>
        </ion-item>
      </div>
      
      <ion-button expand="block" shape="round" class="gold-btn" routerLink="/explorar">
        Criar Conta
      </ion-button>

      <p class="footer-text">
        Já tem conta? <a routerLink="/login" class="gold-link underline">Clique aqui</a>
      </p>
    </div>

  </div>
</ion-content>
