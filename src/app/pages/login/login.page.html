<ion-content class="login-bg">
  <div class="login-container">
    
    <h1 class="welcome-title">Bem-vindo de volta</h1>

    <div class="login-card">
      <h2 class="card-title">Iniciar Sessão</h2>

      <div class="input-group">
        <label>E-mail</label>
        <ion-item lines="none" class="custom-input-item">
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          <ion-input type="email" [(ngModel)]="emailInput"></ion-input>
        </ion-item>
      </div>

      <div class="input-group">
        <label>Palavra-passe</label>
        <ion-item lines="none" class="custom-input-item">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input type="password" [(ngModel)]="passwordInput"></ion-input>
        </ion-item>
      </div>

      <div class="forgot-password">
        <a class="forgot-link">Esqueceu a palavra-passe?</a>
      </div>
      
      <ion-button expand="block" shape="round" class="gold-login-btn" style="z-index: 9999; position: relative; pointer-events: auto;" (click)="fazerLogin()">
        Entrar
      </ion-button>

      <p class="register-text">
        Ainda não tem conta? <a routerLink="/registo" class="gold-link">Criar conta</a>
      </p>
    </div>

  </div>
</ion-content>
