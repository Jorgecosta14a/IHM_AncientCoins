<ion-content class="auth-bg">
  <div class="overlay">
    
    <h1 class="main-title">Bem-Vindo</h1>

    <div class="auth-card">
      <h2 class="card-title">Iniciar sessão</h2>

      <div class="input-group">
        <label>E-mail ou nome de utilizador</label>
        <ion-item lines="none" class="custom-input">
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-input type="text"></ion-input>
        </ion-item>
      </div>

      <div class="input-group">
        <label>Palavra-passe</label>
        <ion-item lines="none" class="custom-input">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input type="password"></ion-input>
        </ion-item>
      </div>

      <div class="forgot-pwd">
        <a href="#" class="gold-link underline">Esqueceu-se da palavra-passe?</a>
      </div>

  
      <ion-button expand="block" shape="round" class="gold-btn" routerLink="/explorar">
        Entrar
      </ion-button>

      <p class="footer-text">
        Ainda não tem conta? <a routerLink="/registo" class="gold-link underline">Clique aqui</a>
      </p>
    </div>

  </div>
</ion-content>
